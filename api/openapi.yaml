openapi: 3.1.0
info:
  title: PurohitDesk API
  version: 0.8.0
  description: |
    Written per milestone (docs/plan.md). JSON, UTF-8, snake_case fields matching SQL columns.
    Every write calls exactly one PostgreSQL command (`x-db-function`); `x-permission` names the permission the
    database checks. Errors use the envelope in components.schemas.ErrorEnvelope (spec §11 §3).
servers:
  - url: /api/v1
security:
  - bearer: []
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness and deployed commit
      security: []
      x-permission: none
      x-db-function: none
      responses:
        '200':
          description: OK (never cached)
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, commit]
                properties:
                  status: { type: string, const: ok }
                  commit: { type: string, description: 'git SHA, or "unknown" outside Vercel' }
  /session:
    get:
      operationId: getSession
      summary: The signed-in user and their active memberships; first call creates the app user
      x-permission: authenticated
      x-db-function: app.ensure_current_user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Error' }
  /me:
    patch:
      operationId: updateMyProfile
      summary: Change own display name and/or language; also sets the NEXT_LOCALE cookie
      x-permission: authenticated
      x-db-function: app.update_my_profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMyProfileRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /onboarding/practice:
    post:
      operationId: createPractice
      summary: Create a practice in one step (organization, OWNER membership, priest profile and link, offerings)
      x-permission: authenticated (max 3 organizations per user)
      x-db-function: app.bootstrap_practice
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePracticeRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatePracticeResult' }
        '200':
          description: Replay of an earlier request with the same Idempotency-Key and body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatePracticeResult' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /ceremony-types:
    get:
      operationId: listCeremonyTypes
      summary: The global ceremony catalog
      x-permission: authenticated
      x-db-function: none (SELECT under RLS)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CeremonyType' }
        '401': { $ref: '#/components/responses/Error' }
  /organization:
    get:
      operationId: getOrganization
      summary: The organization selected by X-Tenant-ID
      x-permission: ORG_READ
      x-db-function: none (SELECT under RLS)
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: OK
          headers:
            ETag: { schema: { type: string }, description: '"<version>"' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateOrganization
      summary: Rename the practice or change its time zone (IANA names only); audited as ORG_UPDATED
      x-permission: ORG_SETTINGS
      x-db-function: app.update_organization
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateOrganizationRequest' }
      responses:
        '200':
          description: OK
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /customers:
    get:
      operationId: listCustomers
      summary: Customers of the practice, keyset-paginated, optionally searched by name (word prefix) or phone
      x-permission: CUSTOMER_READ
      x-db-function: none (SELECT under RLS)
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: q, in: query, schema: { type: string, maxLength: 60 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string }, description: opaque, from next_cursor }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Customer' }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      operationId: createCustomer
      summary: Add a customer (phone optional and not unique; duplicates are reported, not refused)
      x-permission: CUSTOMER_WRITE
      x-db-function: app.create_customer
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCustomerRequest' }
      responses:
        '201':
          description: Created
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerCommandResult' }
        '200':
          description: Replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerCommandResult' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /customers/{customerId}:
    parameters:
      - { name: customerId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getCustomer
      summary: One customer (erased customers answer 404)
      x-permission: CUSTOMER_READ
      x-db-function: none (SELECT under RLS)
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: OK
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateCustomer
      summary: Change name, phone or address; null clears phone/address
      x-permission: CUSTOMER_WRITE
      x-db-function: app.update_customer
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCustomerRequest' }
      responses:
        '200':
          description: OK
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerCommandResult' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /offerings:
    get:
      operationId: listOfferings
      summary: The practice's offerings (active first)
      x-permission: ORG_READ
      x-db-function: none (SELECT under RLS)
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Offering' } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: createOffering
      summary: Add an offering from the catalog (ceremony_type_id) or a custom one (both names and duration)
      x-permission: CATALOG_WRITE
      x-db-function: app.save_offering
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOfferingRequest' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/OfferingResult' } } } }
        '200': { description: Replay, content: { application/json: { schema: { $ref: '#/components/schemas/OfferingResult' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /offerings/{offeringId}:
    parameters:
      - { name: offeringId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateOffering
      summary: Change names, duration, suggested dakshina (paise) or active flag
      x-permission: CATALOG_WRITE
      x-db-function: app.save_offering
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateOfferingRequest' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OfferingResult' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /samagri-templates:
    get:
      operationId: listSamagriTemplates
      summary: Samagri lists (one per offering) with items in order
      x-permission: ORG_READ
      x-db-function: none (SELECT under RLS)
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/SamagriTemplate' } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: createSamagriTemplate
      summary: Create the samagri list of an offering
      x-permission: CATALOG_WRITE
      x-db-function: app.save_samagri_template
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [offering_id, items]
              properties:
                offering_id: { type: string, format: uuid }
                items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/SamagriItemInput' } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/SamagriTemplateResult' } } } }
        '200': { description: Replay, content: { application/json: { schema: { $ref: '#/components/schemas/SamagriTemplateResult' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /samagri-templates/{templateId}:
    parameters:
      - { name: templateId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: replaceSamagriTemplate
      summary: Replace all items of a samagri list (order = array order)
      x-permission: CATALOG_WRITE
      x-db-function: app.save_samagri_template
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items]
              properties:
                items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/SamagriItemInput' } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SamagriTemplateResult' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /priests/{organizationPriestId}:
    parameters:
      - { name: organizationPriestId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updatePriestSettings
      summary: Default travel buffers of a priest in this practice
      x-permission: ORG_SETTINGS, or the priest himself
      x-db-function: app.update_priest_settings
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                default_buffer_before_min: { type: integer, minimum: 0, maximum: 240 }
                default_buffer_after_min: { type: integer, minimum: 0, maximum: 240 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, priest_profile_id, display_name, default_buffer_before_min, default_buffer_after_min, idempotent_replay]
                properties:
                  id: { type: string, format: uuid }
                  priest_profile_id: { type: string, format: uuid }
                  display_name: { type: string }
                  default_buffer_before_min: { type: integer }
                  default_buffer_after_min: { type: integer }
                  idempotent_replay: { type: boolean }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /bookings:
    get:
      operationId: listBookings
      summary: The practice's bookings, by local date then booking number (keyset pagination)
      x-permission: BOOKING_READ
      x-db-function: none (SELECT under RLS)
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/BookingStatus' } }
        - { name: customer_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, description: 'local date, inclusive', schema: { type: string, format: date } }
        - { name: to, in: query, description: 'local date, inclusive; at most 366 days after from', schema: { type: string, format: date } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, next_cursor]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/BookingSummary' } }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      operationId: createBooking
      summary: Create a DRAFT (a date alone is enough), or create and confirm at once with confirm=true
      x-permission: BOOKING_CREATE (+ BOOKING_CONFIRM, or BOOKING_CONFIRM_OWN as the LEAD priest, when confirm=true)
      x-db-function: app.create_booking
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBookingRequest' }
      responses:
        '201': { description: Created, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/BookingCommandResult' } } } }
        '200': { description: Replay, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/BookingCommandResult' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: 'BOOKING_CONFLICT or BUFFER_CONFLICT (details.conflicts, see BookingConflict) or IDEMPOTENCY_REUSE', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '422': { $ref: '#/components/responses/Error' }
  /bookings/{bookingId}:
    parameters:
      - { name: bookingId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getBooking
      summary: The booking read model
      x-permission: BOOKING_READ
      x-db-function: app.get_booking
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200': { description: OK, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Booking' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateBooking
      summary: >-
        JSON patch (null clears, absent keeps). DRAFT: every field. CONFIRMED: schedule fields (timezone, local_date,
        starts_at, ends_at, is_time_tentative, buffers, priest_ids) → 422 reason USE_RESCHEDULE. COMPLETED/CANCELLED:
        only notes, else 409 INVALID_TRANSITION.
      x-permission: BOOKING_EDIT; changing priest_ids as PRIEST (BOOKING_CONFIRM_OWN only) requires being LEAD before and after
      x-db-function: app.update_booking
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBookingRequest' }
      responses:
        '200': { description: OK, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/BookingCommandResult' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /bookings/{bookingId}/confirm:
    parameters:
      - { name: bookingId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: confirmBooking
      summary: DRAFT → CONFIRMED; needs a time (422 TIME_REQUIRED) and a LEAD (422 LEAD_REQUIRED); reserves every assigned priest or none
      x-permission: BOOKING_CONFIRM, or BOOKING_CONFIRM_OWN when the actor is the LEAD priest before and after any priest_ids change
      x-db-function: app.confirm_booking
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmBookingRequest' }
      responses:
        '200': { description: OK, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/BookingCommandResult' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: 'BOOKING_CONFLICT or BUFFER_CONFLICT (details.conflicts), INVALID_TRANSITION, VERSION_CONFLICT or IDEMPOTENCY_REUSE', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '422': { $ref: '#/components/responses/Error' }
  /bookings/{bookingId}/reschedule:
    parameters:
      - { name: bookingId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: rescheduleBooking
      summary: >-
        Move a CONFIRMED booking (times, time zone, tentative flag, buffers, priests) atomically: the old slot is
        released and the new one reserved, or nothing changes. Resets the buffer acknowledgement.
      x-permission: BOOKING_CONFIRM, or BOOKING_CONFIRM_OWN when the actor is the LEAD priest before and after any priest_ids change
      x-db-function: app.reschedule_booking
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RescheduleBookingRequest' }
      responses:
        '200': { description: OK, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/BookingCommandResult' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: 'BOOKING_CONFLICT or BUFFER_CONFLICT (details.conflicts), INVALID_TRANSITION, VERSION_CONFLICT or IDEMPOTENCY_REUSE', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '422': { $ref: '#/components/responses/Error' }
  /bookings/{bookingId}/cancel:
    parameters:
      - { name: bookingId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: cancelBooking
      summary: DRAFT or CONFIRMED → CANCELLED; a CONFIRMED booking needs a reason (3–500 characters); releases the slots
      x-permission: BOOKING_CANCEL, or BOOKING_CANCEL_OWN when the actor is the LEAD priest
      x-db-function: app.cancel_booking
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelBookingRequest' }
      responses:
        '200': { description: OK, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/BookingCommandResult' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /bookings/{bookingId}/complete:
    parameters:
      - { name: bookingId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: completeBooking
      summary: CONFIRMED → COMPLETED once the ceremony has started (else 422 NOT_STARTED); the busy time is kept
      x-permission: BOOKING_COMPLETE, or BOOKING_COMPLETE_OWN when the actor is the LEAD priest
      x-db-function: app.complete_booking
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200': { description: OK, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/BookingCommandResult' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /availability:
    get:
      operationId: getAvailability
      summary: >-
        Busy time of one priest of this practice in every practice he serves. Other practices' spans come back as kind
        BUSY with no ids and no details.
      x-permission: ORG_READ
      x-db-function: app.priest_busy
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: priest_id, in: query, required: true, description: organization_priest id of this practice, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: true, description: 'local date in the practice''s time zone, inclusive', schema: { type: string, format: date } }
        - { name: to, in: query, required: true, description: 'local date, inclusive; at most 62 days of data', schema: { type: string, format: date } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Availability' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /blocks:
    post:
      operationId: createBlock
      summary: Block a priest's time (no travel-time check); ceremony overlap → 409 BOOKING_CONFLICT
      x-permission: BLOCK_MANAGE, or BLOCK_MANAGE_OWN for own calendar
      x-db-function: app.create_block
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBlockRequest' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/BlockResult' } } } }
        '200': { description: Replay, content: { application/json: { schema: { $ref: '#/components/schemas/BlockResult' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /blocks/{blockId}:
    parameters:
      - { name: blockId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: releaseBlock
      summary: Release a block (kept as RELEASED history with released_at/released_by; audited as BLOCK_RELEASED); already released → 409 INVALID_TRANSITION
      x-permission: BLOCK_MANAGE, or BLOCK_MANAGE_OWN for own calendar
      x-db-function: app.release_block
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/BlockResult' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Supabase access token, verified against the project's JWKS (asymmetric keys only), issuer
        <SUPABASE_URL>/auth/v1, audience "authenticated". The PWA's own pages may instead send the httpOnly Supabase
        session cookie; a cookie-authenticated write (any method but GET/HEAD) must then be same-origin
        (`Sec-Fetch-Site: same-origin`, or without Fetch Metadata an `Origin` equal to the API's origin), else 403
        FORBIDDEN with reason CROSS_ORIGIN_REQUEST. Every request body must be sent as `Content-Type:
        application/json`, else 422 VALIDATION_FAILED with reason JSON_REQUIRED.
  parameters:
    TenantId:
      name: X-Tenant-ID
      in: header
      required: true
      description: Organization id. A non-member gets 404, never 403.
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 8–128 visible ASCII characters. Same key + same body replays the first result.
      schema: { type: string, minLength: 8, maxLength: 128 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: '"<version>" from the ETag; a stale version answers 409 VERSION_CONFLICT with details.current_version'
      schema: { type: string, pattern: '^"[0-9]+"$' }
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    Locale:
      type: string
      enum: [hi, en]
    Role:
      type: string
      enum: [OWNER, ADMIN, PRIEST, STAFF, READ_ONLY]
    Permission:
      type: string
      enum: [ORG_READ, ORG_SETTINGS, MEMBER_MANAGE, AUDIT_READ, EXPORT_DATA, CUSTOMER_READ, CUSTOMER_WRITE,
             CUSTOMER_ERASE, CATALOG_WRITE, BOOKING_READ, BOOKING_CREATE, BOOKING_EDIT, BOOKING_CONFIRM,
             BOOKING_CONFIRM_OWN, BOOKING_CANCEL, BOOKING_CANCEL_OWN, BOOKING_COMPLETE, BOOKING_COMPLETE_OWN,
             BLOCK_MANAGE, BLOCK_MANAGE_OWN, PAYMENT_RECORD, PAYMENT_REVERSE, SHARE_MESSAGE, VOICE_USE]
    User:
      type: object
      additionalProperties: false
      required: [id, display_name, preferred_locale]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: [string, 'null'], maxLength: 120 }
        preferred_locale: { $ref: '#/components/schemas/Locale' }
    OrganizationSummary:
      type: object
      additionalProperties: false
      required: [id, name, kind, timezone]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        kind: { type: string, enum: [SOLO, COLLECTIVE] }
        timezone: { type: string, description: IANA time zone }
    Membership:
      type: object
      additionalProperties: false
      required: [organization, role, permissions]
      properties:
        organization: { $ref: '#/components/schemas/OrganizationSummary' }
        role: { $ref: '#/components/schemas/Role' }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
    Session:
      type: object
      additionalProperties: false
      required: [user, memberships]
      properties:
        user: { $ref: '#/components/schemas/User' }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/Membership' }
    UpdateMyProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name: { type: string, minLength: 1, maxLength: 120 }
        preferred_locale: { $ref: '#/components/schemas/Locale' }
    CreatePracticeRequest:
      type: object
      additionalProperties: false
      required: [name, ceremony_type_ids]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        ceremony_type_ids:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: { type: string, format: uuid }
    CreatePracticeResult:
      type: object
      additionalProperties: false
      required: [organization, role, organization_priest_id, offering_count, idempotent_replay]
      properties:
        organization:
          type: object
          additionalProperties: false
          required: [id, name, kind, timezone, status, version]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            kind: { type: string, enum: [SOLO, COLLECTIVE] }
            timezone: { type: string }
            status: { type: string, enum: [ACTIVE, CLOSED] }
            version: { type: integer, minimum: 1 }
        role: { type: string, const: OWNER }
        organization_priest_id: { type: string, format: uuid }
        offering_count: { type: integer, minimum: 1, maximum: 20 }
        idempotent_replay: { type: boolean }
    CeremonyType:
      type: object
      additionalProperties: false
      required: [id, slug, name_en, name_hi, default_duration_min]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name_en: { type: string }
        name_hi: { type: string }
        default_duration_min: { type: integer, minimum: 15, maximum: 1440 }
    Organization:
      type: object
      additionalProperties: false
      required: [id, kind, name, slug, timezone, plan, status, version]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [SOLO, COLLECTIVE] }
        name: { type: string }
        slug: { type: string }
        timezone: { type: string }
        plan: { type: string, enum: [PILOT] }
        status: { type: string, enum: [ACTIVE, CLOSED] }
        version: { type: integer, minimum: 1 }
    Customer:
      type: object
      additionalProperties: false
      required: [id, display_name, phone_e164, address, acquisition_source, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string, maxLength: 120 }
        phone_e164: { type: [string, 'null'], pattern: '^\+[1-9][0-9]{7,14}$' }
        address: { type: [string, 'null'], maxLength: 500 }
        acquisition_source: { type: string, enum: [PRIEST_DIRECT, IMPORT] }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CustomerCommandResult:
      type: object
      additionalProperties: false
      required: [customer, possible_duplicates, idempotent_replay]
      properties:
        customer: { $ref: '#/components/schemas/Customer' }
        possible_duplicates:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, display_name]
            properties:
              id: { type: string, format: uuid }
              display_name: { type: string }
        idempotent_replay: { type: boolean }
    CreateCustomerRequest:
      type: object
      additionalProperties: false
      required: [display_name]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 120 }
        phone: { type: [string, 'null'], maxLength: 32, description: 'Indian formats accepted; stored as E.164' }
        address: { type: [string, 'null'], maxLength: 500 }
    UpdateCustomerRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name: { type: string, minLength: 1, maxLength: 120 }
        phone: { type: [string, 'null'], maxLength: 32 }
        address: { type: [string, 'null'], maxLength: 500 }
    UpdateOrganizationRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        timezone: { type: string, description: 'IANA Area/Location or UTC' }
    Offering:
      type: object
      additionalProperties: false
      required: [id, ceremony_type_id, name_hi, name_en, duration_min, suggested_dakshina_paise, is_active, version]
      properties:
        id: { type: string, format: uuid }
        ceremony_type_id: { type: [string, 'null'], format: uuid }
        name_hi: { type: string, maxLength: 120 }
        name_en: { type: string, maxLength: 120 }
        duration_min: { type: integer, minimum: 15, maximum: 1440 }
        suggested_dakshina_paise: { type: [integer, 'null'], minimum: 0, maximum: 100000000000 }
        is_active: { type: boolean }
        version: { type: integer, minimum: 1 }
    OfferingResult:
      allOf:
        - $ref: '#/components/schemas/Offering'
        - type: object
          required: [idempotent_replay]
          properties:
            idempotent_replay: { type: boolean }
    CreateOfferingRequest:
      type: object
      additionalProperties: false
      description: Either ceremony_type_id (names and duration default from the catalog) or name_hi + name_en + duration_min.
      properties:
        ceremony_type_id: { type: string, format: uuid }
        name_hi: { type: string, minLength: 1, maxLength: 120 }
        name_en: { type: string, minLength: 1, maxLength: 120 }
        duration_min: { type: integer, minimum: 15, maximum: 1440 }
        suggested_dakshina_paise: { type: [integer, 'null'], minimum: 0, maximum: 100000000000 }
        is_active: { type: boolean }
    UpdateOfferingRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name_hi: { type: string, minLength: 1, maxLength: 120 }
        name_en: { type: string, minLength: 1, maxLength: 120 }
        duration_min: { type: integer, minimum: 15, maximum: 1440 }
        suggested_dakshina_paise: { type: [integer, 'null'], minimum: 0, maximum: 100000000000 }
        is_active: { type: boolean }
    SamagriItemInput:
      type: object
      additionalProperties: false
      required: [name, provided_by]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        quantity: { type: [string, 'null'], maxLength: 60 }
        provided_by: { type: string, enum: [FAMILY, PRIEST] }
    SamagriTemplate:
      type: object
      additionalProperties: false
      required: [id, offering_id, version, items]
      properties:
        id: { type: string, format: uuid }
        offering_id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [position, name, quantity, provided_by]
            properties:
              position: { type: integer, minimum: 1 }
              name: { type: string }
              quantity: { type: [string, 'null'] }
              provided_by: { type: string, enum: [FAMILY, PRIEST] }
    SamagriTemplateResult:
      allOf:
        - $ref: '#/components/schemas/SamagriTemplate'
        - type: object
          required: [idempotent_replay]
          properties:
            idempotent_replay: { type: boolean }
    BookingStatus:
      type: string
      enum: [DRAFT, CONFIRMED, COMPLETED, CANCELLED]
    BookingPriest:
      type: object
      additionalProperties: false
      required: [organization_priest_id, priest_profile_id, display_name, role]
      properties:
        organization_priest_id: { type: string, format: uuid }
        priest_profile_id: { type: string, format: uuid }
        display_name: { type: string }
        role: { type: string, enum: [LEAD, ASSISTANT] }
    Booking:
      type: object
      additionalProperties: false
      required: [id, booking_number, status, customer, offering, title, location, notes, agreed_dakshina_paise, timezone,
                 local_date, starts_at, ends_at, is_time_tentative, buffer_before_min, buffer_after_min,
                 buffer_overlap_ack, source, created_via, cancel_reason, priests, confirmed_at, completed_at,
                 cancelled_at, created_at, updated_at, version]
      properties:
        id: { type: string, format: uuid }
        booking_number: { type: string, pattern: '^PD-[0-9]{2}-[0-9]{4,}$' }
        status: { $ref: '#/components/schemas/BookingStatus' }
        customer:
          type: object
          additionalProperties: false
          required: [id, display_name]
          properties: { id: { type: string, format: uuid }, display_name: { type: string } }
        offering:
          type: object
          additionalProperties: false
          required: [id, name_hi, name_en, duration_min]
          properties:
            id: { type: string, format: uuid }
            name_hi: { type: string }
            name_en: { type: string }
            duration_min: { type: integer }
        title: { type: [string, 'null'], maxLength: 120 }
        location: { type: [string, 'null'], maxLength: 500 }
        notes: { type: [string, 'null'], maxLength: 2000 }
        agreed_dakshina_paise: { type: [integer, 'null'], minimum: 0, maximum: 100000000000 }
        timezone: { type: string, description: IANA time zone }
        local_date: { type: string, format: date, description: 'the start''s date in timezone; a date-only draft has no times' }
        starts_at: { type: [string, 'null'], format: date-time }
        ends_at: { type: [string, 'null'], format: date-time }
        is_time_tentative: { type: boolean, description: 'the whole window is reserved; the exact muhurat comes later' }
        buffer_before_min: { type: [integer, 'null'], minimum: 0, maximum: 360 }
        buffer_after_min: { type: [integer, 'null'], minimum: 0, maximum: 360 }
        buffer_overlap_ack: { type: boolean }
        source: { type: string, enum: [PRIEST_DIRECT] }
        created_via: { type: string, enum: [MANUAL] }
        cancel_reason: { type: [string, 'null'], maxLength: 500 }
        priests: { type: array, maxItems: 11, items: { $ref: '#/components/schemas/BookingPriest' } }
        confirmed_at: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        cancelled_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    BookingSummary:
      type: object
      additionalProperties: false
      required: [id, booking_number, status, customer, offering, title, local_date, starts_at, ends_at, timezone,
                 is_time_tentative, version]
      properties:
        id: { type: string, format: uuid }
        booking_number: { type: string }
        status: { $ref: '#/components/schemas/BookingStatus' }
        customer:
          type: object
          additionalProperties: false
          required: [id, display_name]
          properties: { id: { type: string, format: uuid }, display_name: { type: string } }
        offering:
          type: object
          additionalProperties: false
          required: [id, name_hi, name_en]
          properties: { id: { type: string, format: uuid }, name_hi: { type: string }, name_en: { type: string } }
        title: { type: [string, 'null'] }
        local_date: { type: string, format: date }
        starts_at: { type: [string, 'null'], format: date-time }
        ends_at: { type: [string, 'null'], format: date-time }
        timezone: { type: string }
        is_time_tentative: { type: boolean }
        version: { type: integer, minimum: 1 }
    BookingCommandResult:
      type: object
      additionalProperties: false
      required: [booking, idempotent_replay]
      properties:
        booking: { $ref: '#/components/schemas/Booking' }
        idempotent_replay: { type: boolean }
    BookingConflict:
      type: object
      additionalProperties: false
      description: One busy span in error.details.conflicts of BOOKING_CONFLICT. booking_id only for the same practice.
      required: [organization_priest_id, starts_at, ends_at, same_org]
      properties:
        organization_priest_id: { type: string, format: uuid, description: 'the priest of THIS booking who is busy' }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        same_org: { type: boolean }
        booking_id: { type: string, format: uuid }
        block: { type: boolean, const: true, description: 'present for a calendar block of the same practice' }
    BookingFields:
      type: object
      properties:
        customer_id: { type: string, format: uuid }
        offering_id: { type: string, format: uuid }
        title: { type: [string, 'null'], maxLength: 120 }
        location: { type: [string, 'null'], maxLength: 500 }
        notes: { type: [string, 'null'], maxLength: 2000 }
        agreed_dakshina_paise: { type: [integer, 'null'], minimum: 0, maximum: 100000000000 }
        timezone: { type: string, description: 'IANA name; default the practice''s' }
        local_date: { type: [string, 'null'], format: date, description: 'required without times; must match starts_at' }
        starts_at: { type: [string, 'null'], format: date-time, description: 'RFC 3339 with an offset; with ends_at, at most 7 days' }
        ends_at: { type: [string, 'null'], format: date-time }
        is_time_tentative: { type: boolean }
        buffer_before_min: { type: [integer, 'null'], minimum: 0, maximum: 360, description: 'default: the LEAD''s' }
        buffer_after_min: { type: [integer, 'null'], minimum: 0, maximum: 360 }
        priest_ids: { type: array, maxItems: 11, uniqueItems: true, items: { type: string, format: uuid }, description: 'organization_priest ids; first = LEAD' }
    CreateBookingRequest:
      allOf:
        - $ref: '#/components/schemas/BookingFields'
        - type: object
          required: [customer_id, offering_id]
          properties:
            confirm: { type: boolean, default: false }
            ack_buffer_overlap: { type: boolean, default: false, description: 'with confirm: accept a travel-time overlap (else 409 BUFFER_CONFLICT)' }
      unevaluatedProperties: false
    UpdateBookingRequest:
      allOf:
        - $ref: '#/components/schemas/BookingFields'
      minProperties: 1
      unevaluatedProperties: false
    ConfirmBookingRequest:
      type: object
      additionalProperties: false
      properties:
        priest_ids: { type: array, minItems: 1, maxItems: 11, uniqueItems: true, items: { type: string, format: uuid } }
        ack_buffer_overlap: { type: boolean, default: false, description: 'accept a travel-time overlap (else 409 BUFFER_CONFLICT)' }
    RescheduleReasonCode:
      type: string
      enum: [CUSTOMER_REQUEST, PRIEST_REQUEST, MUHURAT_FIXED, PRIEST_CHANGED, CORRECTION, OTHER]
    RescheduleBookingRequest:
      type: object
      additionalProperties: false
      description: Only schedule fields; free text is refused (history holds codes only). At least one value must change.
      required: [reason_code]
      properties:
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        timezone: { type: string }
        is_time_tentative: { type: boolean }
        buffer_before_min: { type: integer, minimum: 0, maximum: 360 }
        buffer_after_min: { type: integer, minimum: 0, maximum: 360 }
        priest_ids: { type: array, minItems: 1, maxItems: 11, uniqueItems: true, items: { type: string, format: uuid } }
        reason_code: { $ref: '#/components/schemas/RescheduleReasonCode' }
        ack_buffer_overlap: { type: boolean, default: false }
    CancelBookingRequest:
      type: object
      additionalProperties: false
      properties:
        reason: { type: [string, 'null'], maxLength: 500, description: 'required (3+ characters) for a CONFIRMED booking' }
    Availability:
      type: object
      additionalProperties: false
      required: [priest_id, timezone, from, to, busy]
      properties:
        priest_id: { type: string, format: uuid }
        timezone: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        busy:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, starts_at, ends_at, same_org]
            properties:
              kind: { type: string, enum: [BOOKING, BLOCK, BUSY], description: 'BUSY = another practice (no details)' }
              starts_at: { type: string, format: date-time }
              ends_at: { type: string, format: date-time }
              same_org: { type: boolean }
              booking_id: { type: string, format: uuid, description: same practice only }
              block_id: { type: string, format: uuid, description: same practice only }
    Block:
      type: object
      additionalProperties: false
      required: [id, organization_priest_id, starts_at, ends_at, note, status, created_at, released_at, released_by]
      properties:
        id: { type: string, format: uuid }
        organization_priest_id: { type: string, format: uuid }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        note: { type: [string, 'null'], maxLength: 500 }
        status: { type: string, enum: [ACTIVE, RELEASED] }
        created_at: { type: string, format: date-time }
        released_at: { type: [string, 'null'], format: date-time }
        released_by: { type: [string, 'null'], format: uuid, description: app user who released the block }
    BlockResult:
      type: object
      additionalProperties: false
      required: [block, idempotent_replay]
      properties:
        block: { $ref: '#/components/schemas/Block' }
        idempotent_replay: { type: boolean }
    CreateBlockRequest:
      type: object
      additionalProperties: false
      required: [priest_id, starts_at, ends_at]
      properties:
        priest_id: { type: string, format: uuid, description: organization_priest id of this practice }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time, description: after starts_at, at most 31 days later }
        note: { type: [string, 'null'], maxLength: 500 }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              type: string
              enum: [UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, VERSION_CONFLICT, INVALID_TRANSITION, IDEMPOTENCY_REUSE,
                     BOOKING_CONFLICT, BUFFER_CONFLICT, DUPLICATE, VALIDATION_FAILED, QUOTA_EXCEEDED, INTERNAL,
                     VENDOR_UNAVAILABLE]
            reason: { type: string }
            message: { type: string }
            request_id: { type: string, format: uuid }
            details: { type: object }
