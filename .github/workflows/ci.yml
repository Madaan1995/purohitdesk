name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    name: SQL and API integration tests (throwaway Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Match the staging project's Postgres major version once the founder reports it (plan M1).
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway service container only; not a real credential.
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: psql --version
      - run: bash supabase/tests/run.sh
      # Route handlers against the same throwaway database, connected as a real app_runtime login.
      - run: psql -d pd_test -c "ALTER ROLE app_runtime LOGIN PASSWORD 'app_runtime'"
      - run: npm ci
      - run: npm run test:integration
        env:
          PGDATABASE: pd_test
          DATABASE_URL: postgres://app_runtime:app_runtime@localhost:5432/pd_test
